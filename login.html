<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión | Sonido Vivo</title>
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>

    <header class="header-index">
        <a href="index.html">SONIDO VIVO</a>
        <nav class="nav-menu">
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="productos.html">Productos</a></li>
                <li><a href="nosotros.html">Nosotros</a></li>
                <li><a href="blogs.html">Blogs</a></li>
                <li><a href="contacto.html">Contacto</a></li>
            </ul>
        </nav>
        <div class="header-acciones">
            <a href="login.html">Iniciar Sesión</a>
            <a href="registro.html">Registrarse</a>
            <a href="#" class="carrito-link">Carrito(<span id="carrito-count">0</span>)</a>
        </div>
    </header>

    <main>
        <section class="form-section">
            <form id="form-login" class="formulario" novalidate>
                <h1>INICIAR SESIÓN</h1>

                <div class="campo">
                    <label for="correo">Email:</label>
                    <input type="email" id="correo" autocomplete="email">
                    <span class="error-mensaje" id="error-correo"></span>
                </div>

                <div class="campo">
                    <label for="password">Contraseña:</label>
                    <input type="password" id="password" name="password">
                    <span class="error-mensaje" id="error-password"></span>
                </div>

                <button type="submit" class="btn-primary">Iniciar</button>
                <p class="form-exito" id="login-exito"></p>

                <p class="form-enlace">¿Deseas Registrarse?<a href="registro.html">Crear Cuenta</a></p>

            </form>
        </section>
    </main>
     <footer class="site-footer">
        <p>2026 Sonido Vivo. Todos los derechos reservados.</p>
        <nav class="footer-nav">
            <a href="nosotros.html">Nosotros</a>
            <a href="blogs.html">Blogs</a>
            <a href="contacto.html">Contacto</a>
        </nav>
    </footer>

    <script src="js/productos.js"></script>
    <script src="js/carrito.js"></script>
    <script src="js/validaciones.js"></script>
</body>
</html>
