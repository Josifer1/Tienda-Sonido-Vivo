<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Usuario | Sonido Vivo</title>
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>

    <header class="header-index">
        <a href="index.html">SONIDO VIVO</a>
        <nav class="nav-menu">
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="productos.html">Productos</a></li>
                <li><a href="nosotros.html">Nosotros</a></li>
                <li><a href="blogs.html">Blogs</a></li>
                <li><a href="contacto.html">Contacto</a></li>
            </ul>
        </nav>
        <div class="header-acciones">
            <a href="login.html">Iniciar Sesión</a>
            <a href="registro.html">Registrarse</a>
            <a href="#" class="carrito-link">Carrito(<span id="carrito-count">0</span>)</a>
        </div>
    </header>

    <main>
        <section class="form-section">
            <form id="form-registro" class="formulario" novalidate>
                <h1>Registro de usuario</h1>

                <div class="campo">
                    <label for="run">RUN =</label>
                    <input type="text" id="run" name="run" placeholder="19011022K">
                    <span class="error-mensaje" id="error-run"></span>
                </div>

                <div class="campo">
                    <label for="nombre">Nombre =</label>
                    <input type="text" id="nombre" name="nombre" autocomplete="given-name">
                    <span class="error-mensaje" id="error-nombre"></span>
                </div>

                <div class="campo">
                    <label for="apellidos">Apellidos =</label>
                    <input type="text" id="apellidos" name="apellidos" autocomplete="family-name">
                    <span class="error-mensaje" id="error-apellidos"></span>
                </div>

                <div class="campo">
                    <label for="correo">Email = </label>
                    <input type="email" id="correo" name="correo" autocomplete="email" placeholder="nombre@duoc.cl">
                    <span class="error-mensaje" id="error-correo"></span>
                </div>

                <div class="campo">
                    <label for="password">Contraseña =</label>
                    <input type="password" id="password" name="password" autocomplete="new-password">
                    <span class="error-mensaje" id="error-password"></span>
                </div>

                <div class="campo">
                    <label for="password-confirm">Confirmar contraseña = </label>
                    <input type="password" id="password-confirm" name="password-confirm" autocomplete="new-password">
                    <span class="error-mensaje" id="error-password-confirm"></span>
                </div>

                <div class="campo-doble">
                    <div class="campo">
                        <label for="region">Región</label>
                        <select id="region" name="region">
                            <option value="">-- Seleccione la región --</option>
                        </select>
                        <span class="error-mensaje" id="error-region"></span>
                    </div>

                    <div class="campo">
                        <label for="comuna">Comuna</label>
                        <select id="comuna" name="comuna">
                            <option value="">-- Seleccione la comuna --</option>
                        </select>
                        <span class="error-mensaje" id="error-comuna"></span>
                    </div>
                </div>

                <div class="campo">
                    <label for="direccion">Dirección =</label>
                    <input type="text" id="direccion" name="direccion">
                    <span class="error-mensaje" id="error-direccion"></span>
                </div>

                <button type="submit" class="btn-primary">Registrar</button>
                <p class="form-exito" id="registro-exito"></p>
            </form>
        </section>
    </main>

    <footer class="site-footer">
        <p> 2026 Sonido Vivo. Todos los derechos reservados.</p>
        <nav class="footer-nav">
            <a href="nosotros.html">Nosotros</a>
            <a href="blogs.html">Blogs</a>
            <a href="contacto.html">Contacto</a>
        </nav>
    </footer>

    <script src="js/regiones.js"></script>
    <script src="js/productos.js"></script>
    <script src="js/carrito.js"></script>
    <script src="js/validaciones.js"></script>

</body>
</html>
